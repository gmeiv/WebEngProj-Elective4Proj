name: Auto Merge Pull Requests

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

jobs:
    enable-automerge:
        runs-on: ubuntu-latest
        steps:
            -   name: Enable Auto Merge
                uses: peter-evans/enable-pull-request-automerge@v3
                with:
                    token: ${{ secrets.GITHUB_TOKEN}}
                    merge-method: squash