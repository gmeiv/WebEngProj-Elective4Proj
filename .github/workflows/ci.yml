name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- 1. LINT AND TEST (Always Runs) ---
  lint-and-test:
    name: "Lint and Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Run Type Check
        run: npx tsc -b || true
      - name: Run Unit Tests
        run: npx vitest run --coverage

# --- 2. PR LOGIC ---
  handle-pr:
    name: "Auto Merge and Close PR"
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so GH CLI knows where it is

      - name: Attempt Auto Merge
        id: merge
        continue-on-error: true
        run: |
          # Use the --repo flag to be explicit about which repo to close
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Close PR
        if: always()
        run: |
          # Use the --repo flag here too
          gh pr close ${{ github.event.pull_request.number }} --comment "Workflow finished." --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  # --- 3. DEPLOYMENT (Success Path) ---
  build-and-deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest
    needs: [lint-and-test, handle-pr]
    # This runs if tests passed AND (it's a push OR the PR merge was successful)
    if: |
      always() && 
      needs.lint-and-test.result == 'success' && 
      (github.event_name == 'push' || needs.handle-pr.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          docker build --no-cache -t $IMAGE_LATEST .
          docker push $IMAGE_LATEST
      - name: Trigger Render
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"