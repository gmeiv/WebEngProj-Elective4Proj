name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- 1. VALIDATION (Always Runs) ---
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Type Check
        run: npx tsc -b || true
      - name: Run Vitest
        run: npx vitest run --coverage

  # --- 2. PR LOGIC (Only runs if it's a Pull Request) ---
  handle-pr:
    runs-on: ubuntu-latest
    needs: validate
    # This job only exists if the event is a PR
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Attempt Merge
        id: merge
        continue-on-error: true
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Failure
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **PR Automation Failed**\n\nTests passed, but the merge failed (check for conflicts).`
            });

      - name: Auto-Close PR
        if: always()
        run: gh pr close ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 3. DEPLOYMENT (Runs if Test is successful) ---
  build-and-deploy:
    runs-on: ubuntu-latest
    # If it's a PR, wait for 'handle-pr'. If it's a push, wait for 'validate'.
    needs: [validate, handle-pr]
    if: |
      always() && 
      needs.validate.result == 'success' && 
      (github.event_name == 'push' || needs.handle-pr.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          docker build --no-cache -t $IMAGE_LATEST .
          docker push $IMAGE_LATEST
      - name: Trigger Render
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"