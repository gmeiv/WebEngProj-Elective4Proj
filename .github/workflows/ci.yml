name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/*.tsx src/data/department/*.ts
      - name: Type Check
        run: npx tsc -b || true

  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Vitest
        run: npx vitest run --coverage

  # --- JOB 3: PR AUTOMATION (Only for Pull Requests) ---
  handle-pr:
    name: "Auto Merge / Notify Failure"
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE

      # PATH A: SUCCESSFUL PR (Tests Passed)
      - name: Auto Merge
        if: needs.test.result == 'success'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PATH B: UNSUCCESSFUL PR (Tests Failed)
      - name: Notify Failure and Close
        if: needs.test.result != 'success'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "❌ **notify-failure pr**: Lint or Tests failed. Stopping pipeline." --repo ${{ github.repository }}
          gh pr close ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 4: BUILD + PUSH + DEPLOY ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    # Only runs if Job 2 (Test) was successful
    if: success() 
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          docker build --no-cache -t $IMAGE_LATEST .
          docker push $IMAGE_LATEST
      - name: Trigger Render Deployment
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"