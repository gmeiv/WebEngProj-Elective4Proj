name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- 1. LINT AND TEST (Always Runs) ---
  lint-and-test:
    name: "Lint and Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Lint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Run Type Check
        run: npx tsc -b || true
      - name: Run Unit Tests
        run: npx vitest run --coverage

# --- 2. PR LOGIC (Only runs if it's a Pull Request) ---
  handle-pr:
    name: "Auto Merge and Close PR"
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # <--- THIS WAS MISSING AND CAUSED THE ERROR

      - name: Attempt Auto Merge
        id: merge
        continue-on-error: true
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Merge Failure
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **Merge Failed**: Tests passed, but I couldn't auto-merge (likely a conflict).`
            });

      - name: Auto-Close PR
        if: always()
        run: gh pr close ${{ github.event.pull_request.number }} --comment "Workflow finished. Closing PR."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- 3. DEPLOYMENT (Success Path) ---
  build-and-deploy:
    name: "Build and Deploy"
    runs-on: ubuntu-latest
    needs: [lint-and-test, handle-pr]
    # This runs if tests passed AND (it's a push OR the PR merge was successful)
    if: |
      always() && 
      needs.lint-and-test.result == 'success' && 
      (github.event_name == 'push' || needs.handle-pr.result == 'success')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          docker build --no-cache -t $IMAGE_LATEST .
          docker push $IMAGE_LATEST
      - name: Trigger Render
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"