name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint EE files
        run: |
          npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx

  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b || true
      - name: Run Tests
        run: npx vitest run || echo "Some tests failed, but continuing."

  # --- JOB 3: BUILD AND DEPLOY DOCKER IMAGE ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dept/EE'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image with Layer Cache
        run: |
          IMAGE_TAG="ghcr.io/gmeiv/webeng-ee:latest"
          echo "Building Docker image $IMAGE_TAG..."
          # Use existing image as cache to reuse unchanged layers
          docker build --cache-from $IMAGE_TAG -t $IMAGE_TAG .
          echo "Built $IMAGE_TAG"

      - name: Verify Docker Image
        run: docker run --rm ghcr.io/gmeiv/webeng-ee:latest ls /usr/share/nginx/html

      - name: Push Docker Image
        run: docker push ghcr.io/gmeiv/webeng-ee:latest

      - name: Trigger Render Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -X POST "$RENDER_HOOK"
          fi

      - name: Cleanup Docker to save runner storage
        run: docker system prune -af