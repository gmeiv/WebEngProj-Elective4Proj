name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT & STATIC ANALYSIS ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx

      - name: Run TypeScript Type Check
        run: npx tsc -b || true

  # --- JOB 2: UNIT TESTS ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run || echo "Some tests failed, continuing..."

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: test-results/

  # --- JOB 3: BUILD AND DEPLOY DOCKER IMAGE ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dept/EE'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_TAG="ghcr.io/gmeiv/webeng-ee:latest"
          docker build --progress=plain -t $IMAGE_TAG .
          echo "Built $IMAGE_TAG"

      - name: Verify Docker Image
        run: docker run --rm ghcr.io/gmeiv/webeng-ee:latest ls /usr/share/nginx/html

      - name: Push Docker Image to GHCR
        run: docker push ghcr.io/gmeiv/webeng-ee:latest

      - name: Trigger Render Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -X POST "$RENDER_HOOK"
          fi