name: EE CI/CD with Docker Integration

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node with caching
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3️⃣ Install dependencies (fresh install + rebuild native bindings)
      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm rebuild

      # 4️⃣ Lint, Typecheck, Test
      - name: Lint, Typecheck, Test
        run: |
          npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
          npx tsc -b || true
          npx vitest run

      # 5️⃣ Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6️⃣ Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7️⃣ Build & Push Docker Image
      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/dept/EE' }}
          tags: ghcr.io/${{ github.repository_owner }}/webeng-ee:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8️⃣ Deploy
      - name: Deploy
        if: github.ref == 'refs/heads/dept/EE'
        run: |
          echo "Deploying EE..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}