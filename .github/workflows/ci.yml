name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT & STATIC ANALYSIS ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx

      - name: Run TypeScript Type Check
        run: npx tsc -b || true

  # --- JOB 2: UNIT TESTS ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest with Coverage
        run: npx vitest run --coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      - name: Comment Coverage to PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # --- JOB 3: BUILD AND DEPLOY DOCKER IMAGE ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dept/EE'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="ghcr.io/gmeiv/webeng-ee:${{ github.sha }}"
          LATEST_TAG="ghcr.io/gmeiv/webeng-ee:latest"

          echo "Building image..."
          docker build -t $IMAGE_TAG .

          echo "Tagging as latest..."
          docker tag $IMAGE_TAG $LATEST_TAG

          echo "Pushing images..."
          docker push $IMAGE_TAG
          docker push $LATEST_TAG