name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:

  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx src/Page/styles/EE.css

      - name: Type Check
        run: npx tsc -b || true


  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/


  # --- JOB 3: BUILD + PUSH + DEPLOY ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Tag Docker Image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          IMAGE_VERSION="ghcr.io/$OWNER_LOWER/webeng-ee:$SAFE_TAG"
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"

          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

          docker build --no-cache -t $IMAGE_VERSION -t $IMAGE_LATEST .
          docker run --rm $IMAGE_VERSION ls /usr/share/nginx/html

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_VERSION }}
          docker push ${{ env.IMAGE_LATEST }}

      - name: Trigger Render Deployment
        if: success()
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Deployment..."
          curl -X POST "$RENDER_URL"


  # --- JOB 4: POST-DEPLOY PR CHECK ---
  post-deploy-check:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Check Open Pull Requests
        id: pr_check
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            core.setOutput("count", prs.data.length);

            if (prs.data.length > 0) {
              console.log(`⚠️ There are ${prs.data.length} open pull request(s).`);
            } else {
              console.log("✅ No open pull requests.");
            }

      - name: Notify Result
        run: |
          if [ "${{ steps.pr_check.outputs.count }}" -gt 0 ]; then
            echo "⚠️ Deployment done, but there are still OPEN PRs!"
          else
            echo "✅ Deployment done and no pending PRs."
          fi