name: EE CI/CD Pipeline

on:
  push:
    branches: 
      - dept/EE
  pull_request:
    branches:
      - dept/EE
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Type Check
        run: npx tsc -b || true
      - name: Notify Lint Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.payload.pull_request) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **Lint Check Failed**\n\nESLint or TypeScript validation failed. Please check the logs.`
            });

  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Vitest
        run: npx vitest run --coverage
      - name: Notify Test Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            if (!context.payload.pull_request) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ **Tests Failed**\n\nUnit tests did not pass. Please fix the failing tests.`
            });

  # --- JOB 3: AUTO-MERGE ---
  auto-merge:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Merge Pull Request
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --body "Auto-merged by CI/CD Pipeline"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 4: NOTIFY AUTO-MERGE FAILURE ---
  notify-automerge-failure:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: Notify Merge Failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ **Auto-Merge Failed**\n\nTests passed, but the merge failed (likely due to conflicts).`
            });

  # --- JOB 5: BUILD + PUSH + DEPLOY (ONLY IF MERGED) ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE # Build the merged state
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          docker build -t $IMAGE_LATEST .
          docker push $IMAGE_LATEST
      - name: Trigger Render Deployment
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"

  # --- JOB 6: FINAL CLOSE (SUCCESS OR FAILURE) ---
  closing-pr:
    runs-on: ubuntu-latest
    # Wait for everything else to resolve first
    needs: [auto-merge, notify-automerge-failure, build-and-deploy]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Close Pull Request
        run: gh pr close ${{ github.event.pull_request.number }} 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}