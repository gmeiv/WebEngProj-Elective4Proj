name: CI/CD

on:
  push:
    branches: [ dept/EE ]
  pull_request:
    branches: [ dept/EE ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint  # if you have lint script

    - name: Build
      run: npm run build