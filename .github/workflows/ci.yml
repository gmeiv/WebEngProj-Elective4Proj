name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT & STATIC ANALYSIS ---
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx

      - name: Run TypeScript Type Check
        run: npx tsc -b || true


  # --- JOB 2: UNIT TESTS ---
  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest with Coverage
        run: npx vitest run --coverage

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

      - name: Comment Coverage to PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true


  # --- JOB 3: BUILD + PUSH + DEPLOY ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dept/EE'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- LOGIN TO GHCR ---
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD IMAGE ---
      - name: Build Docker Image
        run: |
          IMAGE="ghcr.io/gmeiv/webeng-ee"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker build -t $SHA_TAG .
          docker tag $SHA_TAG $LATEST_TAG

      # --- PUSH IMAGE ---
      - name: Push Docker Image
        run: |
          IMAGE="ghcr.io/gmeiv/webeng-ee"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"

          docker push $SHA_TAG
          docker push $LATEST_TAG

      # --- TRIGGER RENDER DEPLOY ---
      - name: Trigger Render Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render deploy..."
          curl -fsSL -X POST "$RENDER_HOOK"