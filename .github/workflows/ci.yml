name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx

      - name: Type Check
        run: npx tsc -b || true


  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

   # --- STAGE 2: BUILD + PUSH + DEPLOY ---
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Tag Docker Image (CE STYLE)
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SAFE_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')

          IMAGE_ID="ghcr.io/$OWNER_LOWER/webeng-ee:$SAFE_TAG"

          echo "IMAGE_ID=$IMAGE_ID" >> $GITHUB_ENV

          docker build -t $IMAGE_ID .

          # optional verification (same as CE)
          docker run --rm $IMAGE_ID ls /usr/share/nginx/html

      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_ID }}

      - name: Trigger Render Deployment
        if: success()
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Deployment..."
          curl -X POST "$RENDER_URL"