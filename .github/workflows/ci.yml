name: EE Enterprise CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: QUALITY & COMPLIANCE ---
  quality-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Lint EE Code
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Typecheck EE Code
        run: npx tsc -b
      - name: Archive Quality Logs
        uses: actions/upload-artifact@v3
        with:
          name: quality-logs
          path: logs || true

  # --- JOB 2: UNIT & SMOKE TESTS ---
  test-validation:
    runs-on: ubuntu-latest
    needs: quality-compliance
    steps:
      - uses: actions/checkout@v4
      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit & Smoke Tests
        id: ee-tests
        run: |
          mkdir -p logs
          npx vitest run src/Pages/departments/EE.smoke.test.tsx > logs/test_results.txt 2>&1 || \
          (echo "EE_TESTS_FAILED=true" >> $GITHUB_ENV && exit 1)
      - name: Archive Test Logs
        uses: actions/upload-artifact@v3
        with:
          name: test-logs
          path: logs

  # --- JOB 3: DOCKER BUILD & DEPLOY ---
  docker-release:
    runs-on: ubuntu-latest
    needs: test-validation
    if: github.ref == 'refs/heads/dept/EE'
    steps:
      - uses: actions/checkout@v4
      - name: Docker Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image (with caching)
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/ee-enterprise:$TAG"

          echo "Building Docker image $IMAGE..."
          docker build --cache-from $IMAGE -t $IMAGE .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Verify Docker Build
        run: docker run --rm ${{ env.IMAGE }} ls /usr/share/nginx/html
      - name: Push Docker Image
        run: docker push ${{ env.IMAGE }}
      - name: Trigger Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            curl -X POST "$RENDER_HOOK"
          fi
      - name: Cleanup Docker
        run: docker system prune -af

  # --- JOB 4: PULL REQUEST FEEDBACK ---
  pr-feedback:
    needs: [quality-compliance, test-validation, docker-release]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR for EE Pipeline Failures
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ⚠️ **EE Enterprise Pipeline Alert**

            The current pull request encountered issues in the pipeline:

            - **Quality & Compliance**: Linting or TypeScript errors.
            - **Unit & Smoke Tests**: Vitest failures.
            - **Docker Build/Deploy**: Check logs for image build issues.

            🔗 [View Full CI/CD Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})