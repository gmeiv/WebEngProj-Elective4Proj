name: EE CI/CD with Docker Integration

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ⚡ Faster Node setup with caching
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: |
          # Clean slate
          rm -rf node_modules package-lock.json

          # Install dependencies normally
          npm install

          # Rebuild native bindings (like esbuild)
          npm rebuild

          # Force install esbuild to make sure the binary exists
          npm install esbuild --force

      - name: Lint, Typecheck, Test
        run: |
          npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
          npx tsc -b || true
          npx vitest run

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/dept/EE' }}
          tags: ghcr.io/${{ github.repository_owner }}/webeng-ee:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy
        if: github.ref == 'refs/heads/dept/EE'
        run: |
          echo "Deploying EE..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}