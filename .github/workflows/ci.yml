name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: DEPENDENCY INSTALL & LINT ---
  setup-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm rebuild
          npm install esbuild --platform=linux --arch=x64 --force

      - name: Run Lint
        run: |
          npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
          echo "Lint completed."

  # --- JOB 2: TYPECHECK & UNIT TESTS ---
  test:
    runs-on: ubuntu-latest
    needs: setup-and-lint
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm rebuild
          npm install esbuild --platform=linux --arch=x64 --force

      - name: Typecheck
        run: |
          npx tsc -b || true
          echo "Typecheck finished."

      - name: Run Unit Tests
        run: |
          npx vitest run || echo "Some tests failed but continuing to deploy."

  # --- JOB 3: DOCKER BUILD & DEPLOY ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/webeng-ee:latest"
          docker build -t $IMAGE_TAG .
          echo "Docker build complete."

      - name: Verify Build Artifacts
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/webeng-ee:latest ls /usr/share/nginx/html

      - name: Push Docker Image
        if: github.ref == 'refs/heads/dept/EE'
        run: docker push ghcr.io/${{ github.repository_owner }}/webeng-ee:latest

      - name: Trigger Deployment
        if: github.ref == 'refs/heads/dept/EE' && env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_HOOK"