name: EE CI/CD Pipeline

on:
  push:
    branches: [dept/EE]
  pull_request:
    branches: [dept/EE]
  workflow_dispatch:

jobs:
  # --- JOB 1: LINT ---
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint src/Pages/admin/EEAdmin.tsx src/Pages/departments/EE.tsx
      - name: Type Check
        run: npx tsc -b || true

  # --- JOB 2: TEST ---
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Vitest
        run: npx vitest run --coverage
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/

  # --- JOB 3: AUTO-MERGE ---
  auto-merge:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Squash and Merge
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 4: NOTIFY AUTO-MERGE FAILURE ---
  notify-failure:
    runs-on: ubuntu-latest
    needs: [test, auto-merge]
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: Notify PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `⚠️ **CI/CD Automation Failed**\n\nThe pipeline stopped because tests failed or a merge conflict occurred. Please check the logs.`
            });

  # --- JOB 5: BUILD + PUSH + DEPLOY (ONLY ON SUCCESSFUL MERGE) ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: auto-merge
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: dept/EE 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Tag Docker Image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LATEST="ghcr.io/$OWNER_LOWER/webeng-ee:latest"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV
          docker build --no-cache -t $IMAGE_LATEST .
      - name: Push Docker Image
        run: docker push ${{ env.IMAGE_LATEST }}
      - name: Trigger Render Deployment
        env:
          RENDER_URL: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_URL"

  # --- JOB 6: AUTO-CLOSE ---
  auto-close-pr:
    runs-on: ubuntu-latest
    needs: [auto-merge, notify-failure, build-and-deploy]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Close Pull Request
        run: gh pr close ${{ github.event.pull_request.number }} --comment "Workflow finished. Closing PR."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}